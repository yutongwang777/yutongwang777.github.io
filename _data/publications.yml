        "caption": "To visualize model interpretability in identifying non-covalent interactions (specifically hydrogen bonds), four representative protein-ligand complexes spanning a range of protein structural complexity were selected and ordered from low to high by Relative Contact Order (RCO) (PDB IDs: 3PXF, 6DAR, 5WMT, and 1BCU) 48 . Regardless of the complexity level of the protein or ligand, the model consistently assigned higher attention weights to non-carbon atoms on the ligands that were likely to form non-covalent interactions within the protein binding pocket.",
