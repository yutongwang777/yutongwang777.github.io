        "title": "Fig. 3: Robustness and generalization of the DPI model in comparison with three state-of-the-art baselines (PSICHIC 20 , SIGN 17 and DMFF 46 ).",
        "caption": "a Experimental design. a1 10-fold cross-validation was performed on the union of PDBbind 2013, 2016 and 2019 42 . a2 To quantify robustness to crystallographic resolution, model performance was evaluated on experimentally resolved structures across different crystallographic resolutions (Å). a3 Generalization to silico-predicted structures (Sil.) was assessed by replacing experimental structures (Exp.) with AlphaFold2 23 (AF2) models for identical amino-acid sequences. a4 Structural-complexity robustness was evaluated by combining ligands of varying molecular complexity with proteins of differing fold complexity and measuring performance across the resulting grid. b Robustness of resolution on model performance. Absolute error (AE) increases with resolution (Å) across four methods. Solid lines represent least-squares fits, and shaded areas indicate 95% confidence intervals. The slopes for E-CloudBind, SIGN, PSICHIC, and DMFF increase progressively, with DMFF exhibiting a statistically significant slope ( p = 0.046), indicating high sensitivity to resolution. In contrast, the stable slope of E-CloudBind suggests robust performance across varying resolutions. c Structural robustness across experimental and AF2 predictions. For every model, paired bars report mean absolute error (MAE, left) and Pearson correlation coefficient (Pearson, right). E-CloudBind attains both the lowest MAE and the highest Pearson on experimental as well as AF2 structures, with a deviation of only 0.012 MAE units between sources. d , e E-CloudBind consistently outperforms baselines in complexity-based evaluations. In Fig. d, the distribution of per-pair AE deviations from the corresponding method’s MAE on the DAVIS dataset 47 indicates that E-CloudBind exhibits a lower and more stable median deviation (0.280) than all baselines. Fig. e visualizes per-pair AE as heat maps across methods, with columns ordered by increasing protein structural complexity (Relative Contact Order, RCO) 48 and rows by increasing ligand structural complexity (Bertz Complexity Index, BertzCT) 49 . Each cell represents a protein-ligand pair, and lighter colors denote lower AE. E-CloudBind achieves the lowest MAE (1.520) and standard deviation (0.340) across all combinations, whereas the baseline models degrade in specific complexity regimes and generalize less consistently.",
        "source_url": "https://media.springernature.com/lw1200/springer-static/image/art%3A10.1038%2Fs41467-026-74196-5/MediaObjects/41467_2026_74196_Fig3_HTML.png",
        "figure_page": "https://www.nature.com/articles/s41467-026-74196-5/figures/3",
