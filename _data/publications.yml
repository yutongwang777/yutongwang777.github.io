        "image": "/images/publications/e-cloudbind/figure-2.png",
        "title": "Fig. 2: Workflow of E-CloudBind framework for binding-affinity prediction.",
        "caption": "a Quantum electron density modeling for ligand. Starting from atomic symbols and Cartesian coordinates, frontier molecular orbitals are computed using a quantum chemistry solver based on density functional theory or ab initio methods (DFT/ab-initio) (a1). While highest occupied/lowest unoccupied molecular orbital (HOMO/LUMO) are shown for visualization, downstream modeling uses the total electron density reconstructed from all occupied orbitals 70 . The resulting coefficients are used to evaluate the electron density ρ (a2), which is then thresholded and down-sampled to convert ≈10 6 grid points into an ≈10 3 point “electron-density ligand” cloud (a3). b Gaussian electron density modeling for pocket. For each pocket atom (b1), a multivariate Gaussian kernel centered at the atom position provides a proxy for the local electron distribution (b2). The kernel width is linked to the van der Waals (vdW) radius, and density-weighted sampling generates pseudo-electrons with a higher concentration inside the 1 \\(\\times\\) r vdW region than in the 1-2 \\(\\times\\) r vdW shell (b3). Repeating the procedure for all atoms yields an “electron-density pocket” that captures non-covalent interaction geometry while remaining tolerant to coordinate noise (b4). c Covalent graph construction and non-covalent interaction extraction. Atomic covalent connectivity is represented as a directed chemical graph and embedded by a covalent graph encoder (top). The electron-density ligand and pocket are individually clustered by K-means clustering, and each cluster is processed through a 3D point-cloud network to extract non-covalent embeddings (middle, bottom). The curved blue arrow denotes the direction of information aggregation among the point clouds. d Feature fusion and prediction. Covalent and non-covalent node and edge feature vectors are concatenated and fed into a heterogeneous graph convolutional network (GCN) that jointly reasons over both interaction types. The resulting edge-level scores are aggregated to deliver the predicted binding affinity. By combining quantum-mechanical density information with topology-aware encoders, E-CloudBind captures type-specific interaction ranges, preserves anisotropic electrostatics, and remains robust across experimental resolutions and AlphaFold2-predicted structures 23 .",
