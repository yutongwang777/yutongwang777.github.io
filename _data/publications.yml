      {
        "number": 4,
        "image": "/images/publications/e-cloudbind/figure-4.png",
        "title": "Fig. 4: Efficiency of van der Waals-guided Gaussian sampling strategy and generalization of the DPI model.",
        "caption": "a Computational alternatives for modeling ligand electron clouds. Electron-density clouds obtained from xTB quantum calculations (left) and the proposed van der Waals Gaussian sampler (right) are each coupled to the same model and tested on PDBbind 2013-2019 42 . b Performance and prediction distribution on PDBbind test sets (blue/green/yellow)for quantum-derived electron-density modeling (top) and Gaussian-based modeling (bottom). Differences are within ≤ 0.032 for mean absolute error (MAE) and ≤ 0.020 for Pearson correlation coefficient (Pearson), indicating that the inexpensive Gaussian procedure achieves comparable performance to quantum-derived modeling. c Computational cost of electron-cloud modeling. Runtime comparison of the quantum calculation pipeline (QM) versus the proposed van der Waals Gaussian sampling pipeline (GM) on the PDBbind dataset, showing fewer preprocessing steps and lower preprocessing time for GM. d , e Rigid transformation invariance. The ligand and pocket electron clouds were jointly rotated around the z-axis by 0° to 180° at 15° intervals, with a fixed translation applied. Performance remains nearly unchanged across rotations, with only minor deviations from the 0° setting. f , g Electron-cloud distortions under non-rigid transformations. Ligand edges and the corresponding electron-cloud clusters were progressively corrupted to mimic non-rigid strain. Performance degrades monotonically from 0 to 90% corruption, indicating reliance on preserving correct geometric patterns in the electron cloud. h Data-partition strategies. Warm-start performance was evaluated under a random split, whereas cold-start performance was assessed under holdout splits based on (i) ligand scaffolds, (ii) protein sequence-identity clusters, and (iii) joint protein-ligand complex similarity for evaluation on previously unseen patterns. i Comparative performance under warm-start and cold-start splits. E-CloudBind yields the highest Pearson and lowest MAE in every setting. Across the three cold-start regimes, its MAE increases by only 0.026, whereas SIGN 17 , PSICHIC 20 and DMFF 46 deteriorate by 0.101-0.235. j Resolution sensitivity under warm-start and cold-start splits. Absolute error (AE) versus crystallographic resolution for the four data splits (solid line = least-squares fit; shaded band = 95% confidence). E-CloudBind retains a near-zero slope in all splits, while baseline models show marked error inflation as resolution deteriorates.",
