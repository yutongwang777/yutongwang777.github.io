        "title": "Fig. 1: Electron-density-adaptive definition of receptor-ligand non-covalent interactions (NCIs) and a noise-tolerant feature pipeline.",
        "caption": "a Conventional drug-protein interaction (DPI) model prediction pipeline. Conventional DPI models adopt a uniform cut-off scheme, defining a NCI whenever any receptor and ligand atoms fall within a global Euclidean cutoff (e.g., 2.5 Å, yellow envelopes). Since the same radius is applied to all elements, atom identity is ignored, leading to spurious contacts in some cases (red dashed line). The constructed interaction graph is then passed into a graph neural network (GNN) for affinity prediction via message passing. b E-CloudBind prediction pipeline. E-CloudBind employs a density-adaptive scheme. Each atom is represented as a Gaussian electron cloud, and an interaction is recorded when its isosurfaces overlap. Type-specific radii (e.g., 1.2 Å for N, 1.7 Å for S) emerge naturally from local electron densities, preserving chemical identity and eliminating artefactual overlaps. The resulting electron cloud is encoded as a point cloud and input into a point-cloud encoder (PointNet) for affinity prediction. c Robustness of the point-cloud encoding. Conventional graph-based DPI models exhibit high sensitivity to coordinate uncertainty (top): even modest perturbations (Δx ≈ 0.5 Å) can reshuffle atomic contacts, leading to large fluctuations in features learned by the 3D GNN and increased prediction error. In contrast, E-CloudBind employs Gaussian sampling within adaptive envelopes (bottom) to generate a point-cloud representation that is inherently rotation- and translation-invariant, preserving the true contact geometry even under positional perturbations. d Performance and generalization. Density-adaptive envelopes and point-cloud model enable a physically grounded, resolution-robust description of NCIs, leading to improved affinity prediction. The approach excels not only on high-quality structural data, but also demonstrates strong robustness on low-resolution, experimental carbon-based (Exp.) and silicon-based (Sil.) structures, and four types of out-of-distribution (OOD) targets. Performance was evaluated using mean absolute error (MAE) and the Pearson correlation coefficient (Pearson).",
        "source_url": "https://media.springernature.com/full/springer-static/image/art%3A10.1038%2Fs41467-026-74196-5/MediaObjects/41467_2026_74196_Fig1_HTML.png",
        "figure_page": "https://www.nature.com/articles/s41467-026-74196-5/figures/1",
        "width": 1754,
        "height": 1388
