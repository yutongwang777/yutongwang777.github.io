        "title": "Fig. 6: Prospective virtual screening guided by the E-CloudBind affinity predictor.",
        "caption": "Three therapeutically relevant targets were selected: Penicillin-Binding Protein 1 A (PBP1A; PDB: 4OON), the SARS-CoV-2 Main Protease (Mpro; PDB: 7RFS) and the B-Cell Lymphoma 2 (BCL-2; PDB: 4MAN). A library of 80,383 drug-like compounds from ZINC 55 was evaluated by DPI and the top 5% of candidates for each protein were re-docked with AutoDock Vina 80 . For every target the left-most column shows the crystal structure with the binding pocket highlighted (red dashed box). The next three columns depict representative high-ranking candidates. Upper panels display the best-scoring Vina pose, annotated with the docking score. Lower panels visualize residue- and atom-level attention weights inferred by E-CloudBind; darker blue denotes higher contribution. The right-most column provides the co-crystallized ligand for reference, docked and analyzed in the same fashion. Across all systems, the attention hotspots coincide with hydrogen-bond donors/acceptors and π-stacking residues identified in the crystal complexes, confirming that E-CloudBind learns chemically meaningful non-covalent patterns. Notably, many screened compounds exhibit more favorable Vina score values (e.g., −9.45 for BCL-2) than the co-crystallized ligands (−8.84), highlighting chemotypes worthy of experimental follow-up. The combination of rapid Gaussian-based electron density modeling, accurate affinity prediction and interpretable attention maps demonstrates E-CloudBind’s suitability for structure-based lead discovery.",
