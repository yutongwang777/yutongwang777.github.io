    "abstract": "Cascaded Dual-Scale Reconstruction (CDSR) learns whole-slide image representations from a small set of high-resolution patches. A two-stage sampler combines MIL attention ranking with QHVAE-based semantic clustering to select informative, diverse tissue regions. A Local-to-Global Network then combines local morphology and global context through reconstruction. Experiments on Camelyon-16, TCGA-NSCLC, and TCGA-RCC show that roughly nine high-resolution patches per slide can support strong classification performance while substantially reducing training data and computation.",
